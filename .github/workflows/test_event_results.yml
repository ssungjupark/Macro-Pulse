name: Test Event Results Telegram

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test_event_results.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    env:
      REPORT_FORMAT_CONFIG: config/report_formats.json
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build runtime image
        run: docker build -t macro-pulse:event-test .

      - name: Send US report with official FOMC result
        run: |
          docker run --rm \
            -e REPORT_FORMAT_CONFIG \
            -e TELEGRAM_BOT_TOKEN \
            -e TELEGRAM_CHAT_ID \
            -e GEMINI_API_KEY \
            -e KIS_APP_KEY \
            -e KIS_APP_SECRET \
            -v "$PWD:/app" \
            -w /app \
            macro-pulse:event-test \
            bash -o pipefail -lc 'uv run --frozen python src/main.py --market US 2>&1 | tee fomc-event-test.log'

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fomc-event-test-log
          path: fomc-event-test.log
          if-no-files-found: ignore
