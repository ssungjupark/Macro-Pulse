name: KRX Sector Probe

on:
  push:

jobs:
  probe:
    if: github.event.head_commit.message == 'Fix KRX sector flow parsing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
    - name: Install requests
      run: python -m pip install requests
    - name: Validate KRX sector flow end to end
      env:
        PYTHONPATH: src
      run: |
        python - <<'PY'
        from datetime import date

        from macro_pulse.data.providers.krx import fetch_krx_market_state

        state = fetch_krx_market_state(date(2026, 9, 30))
        sector = state["sector_flow"]
        valid = [item for item in sector if item.price is not None]

        print("domestic_flow_count:", len(state["domestic_flow"]))
        print("sector_flow_count:", len(sector))
        print("sector_flow_valid_count:", len(valid))
        for item in valid[:12]:
            print(item.name, item.price, item.change_5d)

        if not valid:
            raise SystemExit("sector flow is still empty")
        PY
