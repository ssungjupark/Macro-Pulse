name: Daily Macro Pulse Report

on:
  schedule:
    # BEGIN GENERATED SCHEDULES
    # KR primary | 15:40 KST | 06:40 UTC | Mon-Fri
    - cron: '40 06 * * 1-5'
    # KR backup | 15:45 KST | 06:45 UTC | Mon-Fri
    - cron: '45 06 * * 1-5'
    # KR backup | 15:50 KST | 06:50 UTC | Mon-Fri
    - cron: '50 06 * * 1-5'
    # KR backup | 15:55 KST | 06:55 UTC | Mon-Fri
    - cron: '55 06 * * 1-5'
    # KR backup | 16:00 KST | 07:00 UTC | Mon-Fri
    - cron: '00 07 * * 1-5'
    # KR backup | 16:05 KST | 07:05 UTC | Mon-Fri
    - cron: '05 07 * * 1-5'
    # KR backup | 16:10 KST | 07:10 UTC | Mon-Fri
    - cron: '10 07 * * 1-5'
    # KR backup | 16:15 KST | 07:15 UTC | Mon-Fri
    - cron: '15 07 * * 1-5'
    # KR backup | 16:20 KST | 07:20 UTC | Mon-Fri
    - cron: '20 07 * * 1-5'
    # US primary | 06:30 KST | 21:30 UTC | Tue-Sat KST
    - cron: '30 21 * * 1-5'
    # US backup | 06:45 KST | 21:45 UTC | Tue-Sat KST
    - cron: '45 21 * * 1-5'
    # US backup | 07:00 KST | 22:00 UTC | Tue-Sat KST
    - cron: '00 22 * * 1-5'
    # END GENERATED SCHEDULES
  workflow_dispatch:
    inputs:
      market:
        description: 'Report market mode'
        required: false
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - KR
          - US
      delivery_guard:
        description: 'Treat this dispatch as a scheduled delivery and suppress duplicates'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: macro-pulse-daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      report_created: ${{ steps.complete.outputs.report_created }}
    env:
      REPORT_FORMAT_CONFIG: config/report_formats.json
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Resolve report context
      id: context
      env:
        MANUAL_MARKET: ${{ github.event.inputs.market || 'AUTO' }}
        TRIGGER_CRON: ${{ github.event.schedule || '' }}
      run: PYTHONPATH=src python -m macro_pulse.workflows.delivery_context

    - name: Check whether guarded report was already sent
      if: github.event_name == 'schedule' || github.event.inputs.delivery_guard == 'true'
      id: sent-cache
      uses: actions/cache/restore@v4
      with:
        path: .macro-pulse-delivery
        key: ${{ steps.context.outputs.cache_key }}

    - name: Set up Python
      if: steps.sent-cache.outputs.cache-hit != 'true'
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'

    - name: Set up uv
      if: steps.sent-cache.outputs.cache-hit != 'true'
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true

    - name: Install runtime dependencies
      if: steps.sent-cache.outputs.cache-hit != 'true'
      run: uv sync --frozen --no-dev

    - name: Run Macro Pulse Bot
      id: bot
      if: steps.sent-cache.outputs.cache-hit != 'true'
      env:
        REPORT_MARKET: ${{ steps.context.outputs.market }}
        DELIVERY_RECEIPT_PATH: ${{ (github.event_name == 'schedule' || github.event.inputs.delivery_guard == 'true') && '.macro-pulse-delivery/sent' || '' }}
      run: |
        set -o pipefail
        uv run --frozen python src/main.py --market "$REPORT_MARKET" 2>&1 | tee macro-pulse.log

    - name: Save guarded delivery receipt
      if: always() && (github.event_name == 'schedule' || github.event.inputs.delivery_guard == 'true') && steps.sent-cache.outputs.cache-hit != 'true' && hashFiles('.macro-pulse-delivery/sent') != ''
      uses: actions/cache/save@v4
      with:
        path: .macro-pulse-delivery
        key: ${{ steps.context.outputs.cache_key }}

    - name: Validate generated report
      if: success() && steps.sent-cache.outputs.cache-hit != 'true'
      run: test -s macro_pulse_report.html

    - name: Prepare public directory
      if: success() && steps.sent-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p public
        mv macro_pulse_report.html public/index.html

    - name: Configure GitHub Pages
      if: success() && steps.sent-cache.outputs.cache-hit != 'true'
      uses: actions/configure-pages@v5

    - name: Upload GitHub Pages artifact
      if: success() && steps.sent-cache.outputs.cache-hit != 'true'
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./public

    - name: Upload workflow artifacts
      if: always() && steps.sent-cache.outputs.cache-hit != 'true'
      uses: actions/upload-artifact@v6
      with:
        name: daily-report-artifacts
        path: |
          macro_pulse_report.html
          public/index.html
          macro-pulse.log
        if-no-files-found: ignore

    - name: Record report creation
      id: complete
      if: success() && steps.sent-cache.outputs.cache-hit != 'true'
      run: echo "report_created=true" >> "$GITHUB_OUTPUT"

  deploy:
    if: ${{ needs.build.outputs.report_created == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  notify-failure:
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    needs:
      - build
      - deploy
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
    - name: Send failure notification
      if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
      run: |
        curl --silent --show-error --fail \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=Macro Pulse workflow failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
