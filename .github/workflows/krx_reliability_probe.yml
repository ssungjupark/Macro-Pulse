name: KRX Reliability Probe

on:
  push:

jobs:
  probe:
    if: github.event.head_commit.message == 'Harden KRX delivery reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
    - name: Install requests
      run: python -m pip install requests
    - name: Verify prior close KRX data
      env:
        PYTHONPATH: src
      run: |
        python - <<'PY'
        from datetime import date
        from macro_pulse.app.cli import validate_krx_delivery_data
        from macro_pulse.data.providers.krx import fetch_krx_market_state

        state = fetch_krx_market_state(date(2026, 10, 1))
        ready, problem = validate_krx_delivery_data(state)
        print("flow:", [(x.name, x.price, x.as_of, x.warning) for x in state["domestic_flow"]])
        print("sector_valid:", len([x for x in state["sector_flow"] if x.price is not None]))
        print("ready:", ready, problem)
        if not ready:
            raise SystemExit(problem)
        PY
