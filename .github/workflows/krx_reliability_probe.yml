name: KRX Reliability Probe

on:
  push:

jobs:
  probe:
    if: github.event.head_commit.message == 'Harden KRX delivery reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
    - name: Install requests
      run: python -m pip install requests python-dotenv
    - name: Verify prior close KRX data
      env:
        PYTHONPATH: src
      run: |
        python - <<'PY'
        from datetime import date
                from macro_pulse.data.providers.krx import fetch_krx_market_state

        state = fetch_krx_market_state(date(2026, 10, 1))
        flow = state["domestic_flow"]
        sector = state["sector_flow"]
        valid_flow = [x for x in flow if x.price is not None]
        valid_sector = [x for x in sector if x.price is not None and x.name != "업종별 수급"]

        print("flow:", [(x.name, x.price, x.as_of, x.warning) for x in flow])
        print("sector_valid:", len(valid_sector))
        print("ready:", len(valid_flow) == 4 and len(valid_sector) >= 12)

        if len(valid_flow) != 4:
            raise SystemExit(f"domestic flow incomplete: {len(valid_flow)}/4")
        if len(valid_sector) < 12:
            raise SystemExit(f"sector flow incomplete: {len(valid_sector)}/12")
        PY
